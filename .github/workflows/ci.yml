name: ADA CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-validation:
    name: Backend Validation (FastAPI + PostgreSQL + Migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ada_test
          POSTGRES_USER: ada_admin
          POSTGRES_PASSWORD: test_password_12345
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Alembic Migrations
        env:
          DATABASE_URL: postgresql://ada_admin:test_password_12345@localhost:5432/ada_test
        run: alembic upgrade head

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: test
          DATABASE_URL: "sqlite:///:memory:"
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_minimum_32_characters_for_ci_suite
        run: pytest -v --maxfail=1 --disable-warnings

  frontend-validation:
    name: Frontend Validation (React + TypeScript + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install NPM Dependencies
        run: npm ci

      - name: TypeScript Strict Typecheck
        run: npx tsc --noEmit

      - name: Run Frontend Tests
        run: npm run test

      - name: Build Production Bundle
        run: npm run build

  docker-build-validation:
    name: Container Build Validation
    runs-on: ubuntu-latest
    needs: [backend-validation, frontend-validation]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ada-backend:ci-test

      - name: Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: ada-frontend:ci-test

